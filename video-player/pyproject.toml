[project]
name = "video-player"
version = "0.1.0"
description = "NetFlux video-player microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi[standard]",
    "paho-mqtt",
    "redis",
    "sqlalchemy",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
