# Shared infrastructure for NetFlux microservices (professor-provided baseline).
# Extend service-specific configuration here when the course materials require it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netflux
      POSTGRES_PASSWORD: netflux
      POSTGRES_DB: netflux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro

volumes:
  postgres_data: