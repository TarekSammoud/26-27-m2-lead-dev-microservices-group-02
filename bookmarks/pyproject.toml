[project]
name = "bookmarks"
version = "0.1.0"
description = "NetFlux bookmarks microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi[standard]",
    "paho-mqtt",
    "redis",
    "sqlalchemy",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
